version: '3'

services:
  # ============================================
  # Next.js Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kec-wms-app
    restart: unless-stopped
    ports:
      - "30001:3000"
    env_file:
      - .env
    networks:
      - kec-wms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================
# Networks
# ============================================
networks:
  kec-wms-network:
    driver: bridge
    name: kec-wms-network
