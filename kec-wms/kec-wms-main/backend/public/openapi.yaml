openapi: 3.0.0
info:
  title: WMS 外部 API
  version: 1.2.0
  description: |
    WMS 系统对外提供的 API 接口，供 ERP、OMS 等系统集成使用。

    ## 认证方式
    所有 API 请求都需要在 HTTP 请求头中携带 API Key：X-API-Key

    ## 响应格式
    所有接口统一返回 JSON 格式，包含 success、message、data 等字段
  contact:
    name: WMS API Support

servers:
  - url: http://localhost:3000/api/v1
    description: 开发环境

security:
  - ApiKeyAuth: []

tags:
  - name: SKU
    description: SKU 商品管理接口
  - name: ASN
    description: 入库通知单管理接口
  - name: 库存
    description: 库存与库存流水接口
  - name: 出库订单
    description: 出库订单管理接口

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key 认证

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 操作成功
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 错误描述
        code:
          type: string
          example: ERROR_CODE

paths:
  /skus:
    post:
      tags:
        - SKU
      summary: 创建SKU
      description: 创建新的SKU商品信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - skuCode
                - skuName
                - clientCode
              properties:
                skuCode:
                  type: string
                  example: SKU-TEST-001
                skuName:
                  type: string
                  example: 测试商品A
                clientCode:
                  type: string
                  example: C001
                barcode:
                  type: string
                unit:
                  type: string
                  default: PCS
                lengthCm:
                  type: number
                widthCm:
                  type: number
                heightCm:
                  type: number
                weightKg:
                  type: number
                unitPrice:
                  type: number
                currency:
                  type: string
                  default: CNY
                storageCondition:
                  type: string
                  enum: [NORMAL, COLD, FROZEN, HAZMAT, CONTROLLED]
                isBatchManaged:
                  type: boolean
                isSerialManaged:
                  type: boolean
                isExpiryManaged:
                  type: boolean
                abcClass:
                  type: string
                  enum: [A, B, C]
                notes:
                  type: string
      responses:
        '200':
          description: 创建成功
        '400':
          description: 参数错误
        '401':
          description: 未授权
    get:
      tags:
        - SKU
      summary: 查询SKU列表
      parameters:
        - name: clientCode
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: 查询成功

  /asn:
    post:
      tags:
        - ASN
      summary: 创建ASN
      description: 创建入库通知单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientCode
                - warehouseCode
                - externalNumber
                - lines
              properties:
                clientCode:
                  type: string
                  example: CLIENT001
                  description: 客户编码
                warehouseCode:
                  type: string
                  example: WH-SH-001
                  description: 仓库编码
                asnNumber:
                  type: string
                  example: ASN-2026-001
                  description: ASN单号，不填则自动生成
                externalNumber:
                  type: string
                  example: PO-12345
                  description: 外部单号（用于后续查询/更新/删除）
                asnType:
                  type: string
                  enum: [NORMAL, RETURN, TRANSFER, PRODUCTION, ADJUSTMENT]
                  default: NORMAL
                  example: NORMAL
                  description: ASN类型
                expectedArrivalDate:
                  type: string
                  format: date-time
                  example: "2024-12-20T10:00:00Z"
                  description: 预计到货日期
                expectedArrivalTime:
                  type: string
                  example: "10:00:00"
                  description: 预计到货时间
                notes:
                  type: string
                  example: 请注意轻拿轻放
                  description: 备注
                lines:
                  type: array
                  description: ASN明细行
                  minItems: 1
                  items:
                    type: object
                    required:
                      - skuCode
                      - expectedQty
                    properties:
                      skuCode:
                        type: string
                        example: SKU001
                        description: SKU编码
                      expectedQty:
                        type: integer
                        minimum: 1
                        example: 100
                        description: 预期数量
                      uomCode:
                        type: string
                        example: PCS
                        description: 单位编码
                      batchNumber:
                        type: string
                        example: BATCH001
                        description: 批次号
                      carton:
                        type: string
                        example: CARTON001
                        description: 箱号
                      expiryDate:
                        type: string
                        format: date-time
                        example: "2025-12-31T00:00:00Z"
                        description: 效期
                      notes:
                        type: string
                        example: 第一批货物
                        description: 备注
            example:
              clientCode: CLIENT001
              warehouseCode: WH-SH-001
              asnNumber: ASN-2026-001
              externalNumber: PO-12345
              asnType: NORMAL
              expectedArrivalDate: "2024-12-20T10:00:00Z"
              notes: 请注意轻拿轻放
              lines:
                - skuCode: SKU001
                  expectedQty: 100
                  batchNumber: BATCH001
                  expiryDate: "2025-12-31T00:00:00Z"
                  notes: 第一批货物
                - skuCode: SKU002
                  expectedQty: 50
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ASN创建成功
                  data:
                    type: object
        '400':
          description: 参数错误
        '401':
          description: 未授权

  /inventory:
    get:
      tags:
        - 库存
      summary: 查询库存明细
      description: |
        按仓库、客户、库位、SKU、批次等条件查询库存明细。

        说明：
        - 支持 `warehouseCode`、`clientCode`、`locationCode` 这些对外友好的编码参数
        - 若 API Key 绑定了仓库或客户，查询结果会自动限制在该作用域内
        - 默认返回按库位+SKU+批次+LPN+ASN 汇总后的库存视图
      parameters:
        - name: warehouseCode
          in: query
          description: 仓库编码
          schema:
            type: string
            example: WH-SH-001
        - name: clientCode
          in: query
          description: 客户编码
          schema:
            type: string
            example: CLIENT001
        - name: locationCode
          in: query
          description: 单个库位编码
          schema:
            type: string
            example: A-01-01
        - name: locationCodes
          in: query
          description: 多个库位编码，支持逗号分隔
          schema:
            type: string
            example: A-01-01,A-01-02
        - name: skuCode
          in: query
          description: SKU编码，支持模糊匹配
          schema:
            type: string
            example: SKU-001
        - name: batchNo
          in: query
          description: 批次号（`batchNumber` 的外部别名）
          schema:
            type: string
            example: BATCH-202604
        - name: lpn
          in: query
          description: LPN容器编号
          schema:
            type: string
            example: LPN-0001
        - name: asnNumber
          in: query
          description: ASN单号
          schema:
            type: string
            example: ASN-20260428-001
        - name: bucketType
          in: query
          description: 指定桶类型时返回原始库存桶记录
          schema:
            type: string
            example: AVAILABLE
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页条数，最大100
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        skuCode:
                          type: string
                        skuName:
                          type: string
                        batchNumber:
                          type: string
                        lpn:
                          type: string
                        asnNumber:
                          type: string
                        quantityAvailable:
                          type: integer
                        quantityAllocated:
                          type: integer
                        quantityPicking:
                          type: integer
                        quantityFrozen:
                          type: integer
                        quantityDefective:
                          type: integer
                        quantityException:
                          type: integer
                        lockStatus:
                          type: string
                        warehouse:
                          type: object
                          properties:
                            warehouseCode:
                              type: string
                            warehouseName:
                              type: string
                        location:
                          type: object
                          properties:
                            locationCode:
                              type: string
                            locationType:
                              type: string
                              nullable: true
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
              examples:
                default:
                  summary: 库存明细查询示例
                  value:
                    success: true
                    data:
                      - id: inv-summary-1
                        skuCode: SKU-001
                        skuName: 测试商品A
                        batchNumber: BATCH-202604
                        lpn: LPN-0001
                        asnNumber: ASN-20260428-001
                        quantityAvailable: 120
                        quantityAllocated: 20
                        quantityPicking: 5
                        quantityFrozen: 0
                        quantityDefective: 0
                        quantityException: 0
                        lockStatus: UNLOCKED
                        warehouse:
                          warehouseCode: WH-SH-001
                          warehouseName: 上海总仓
                        location:
                          locationCode: A-01-01
                          locationType: PICK
                    pagination:
                      page: 1
                      pageSize: 20
                      total: 1
                      totalPages: 1
        '400':
          description: 参数错误
        '401':
          description: 未授权

  /inventory/transactions:
    get:
      tags:
        - 库存
      summary: 查询库存流水
      description: |
        按时间窗口和业务条件拉取库存流水，适合作为补偿拉取接口。

        说明：
        - 返回数据来源于 `InventoryEvent`（库存事件）
        - 推荐外部系统按 `createdAt + eventNumber` 分页拉取，并用 `eventNumber` 做幂等去重
        - 若 API Key 绑定了仓库或客户，结果会自动限制在该作用域内
      parameters:
        - name: warehouseCode
          in: query
          description: 仓库编码
          schema:
            type: string
            example: WH-SH-001
        - name: clientCode
          in: query
          description: 客户编码
          schema:
            type: string
            example: CLIENT001
        - name: locationCode
          in: query
          description: 库位编码
          schema:
            type: string
            example: A-01-01
        - name: skuCode
          in: query
          description: SKU编码，支持模糊匹配
          schema:
            type: string
            example: SKU-001
        - name: eventType
          in: query
          description: 事件类型
          schema:
            type: string
            example: PUTAWAY
        - name: bucketType
          in: query
          description: 桶类型
          schema:
            type: string
            example: AVAILABLE
        - name: referenceType
          in: query
          description: 关联单据类型
          schema:
            type: string
            example: ASN
        - name: referenceNumber
          in: query
          description: 关联单据编号，支持模糊匹配
          schema:
            type: string
            example: ASN-20260428-001
        - name: startDate
          in: query
          description: 开始时间，ISO 8601 格式
          schema:
            type: string
            format: date-time
            example: "2026-04-28T00:00:00Z"
        - name: endDate
          in: query
          description: 结束时间，ISO 8601 格式
          schema:
            type: string
            format: date-time
            example: "2026-04-28T23:59:59Z"
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页条数，最大100
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        eventNumber:
                          type: string
                        eventType:
                          type: string
                        bucketType:
                          type: string
                        quantityDelta:
                          type: integer
                        quantityBefore:
                          type: integer
                        quantityAfter:
                          type: integer
                        batchNumber:
                          type: string
                        lpn:
                          type: string
                        asnNumber:
                          type: string
                        referenceType:
                          type: string
                          nullable: true
                        referenceId:
                          type: string
                          nullable: true
                        referenceNumber:
                          type: string
                          nullable: true
                        eventDate:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                        warehouse:
                          type: object
                          properties:
                            warehouseCode:
                              type: string
                            warehouseName:
                              type: string
                        location:
                          type: object
                          properties:
                            locationCode:
                              type: string
                        sku:
                          type: object
                          properties:
                            skuCode:
                              type: string
                            skuName:
                              type: string
                        client:
                          type: object
                          nullable: true
                          properties:
                            clientCode:
                              type: string
                            clientName:
                              type: string
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
              examples:
                default:
                  summary: 库存流水查询示例
                  value:
                    success: true
                    data:
                      - id: evt-1
                        eventNumber: EVT-MA1B2C-8XYZ12
                        eventType: PUTAWAY
                        bucketType: AVAILABLE
                        quantityDelta: 100
                        quantityBefore: 0
                        quantityAfter: 100
                        batchNumber: BATCH-202604
                        lpn: LPN-0001
                        asnNumber: ASN-20260428-001
                        referenceType: ASN
                        referenceId: asn-id-1
                        referenceNumber: ASN-20260428-001
                        eventDate: "2026-04-28T10:15:20.000Z"
                        createdAt: "2026-04-28T10:15:20.000Z"
                        warehouse:
                          warehouseCode: WH-SH-001
                          warehouseName: 上海总仓
                        location:
                          locationCode: A-01-01
                        sku:
                          skuCode: SKU-001
                          skuName: 测试商品A
                        client:
                          clientCode: CLIENT001
                          clientName: 测试客户
                    pagination:
                      page: 1
                      pageSize: 20
                      total: 1
                      totalPages: 1
        '400':
          description: 参数错误
        '401':
          description: 未授权

  /outbound-orders:
    post:
      tags:
        - 出库订单
      summary: 创建出库订单
      description: 创建出库订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientCode
                - warehouseCode
                - consignee
                - items
              properties:
                clientCode:
                  type: string
                  example: CLIENT001
                  description: 客户编码
                warehouseCode:
                  type: string
                  example: WH-SH-001
                  description: 仓库编码
                orderNo:
                  type: string
                  example: OUT-2024-001
                  description: 订单号，不填则自动生成
                externalOrderNo:
                  type: string
                  example: SO-12345
                  description: 外部订单号（用于后续查询/更新/删除）
                orderType:
                  type: string
                  enum: [STANDARD, RETURN, SCRAP, OTHER]
                  default: STANDARD
                  example: STANDARD
                  description: 业务类型
                source:
                  type: object
                  description: 来源信息
                  properties:
                    platform:
                      type: string
                      enum: [SHOPIFY, AMAZON, MANUAL, OTHER]
                      default: OTHER
                      example: SHOPIFY
                      description: 来源平台
                    platformOrderId:
                      type: string
                      example: SHOP-ORDER-001
                      description: 平台原始订单ID
                    channel:
                      type: string
                      example: 官网
                      description: 渠道
                consignee:
                  type: object
                  required:
                    - name
                    - address
                  description: 收货人信息
                  properties:
                    name:
                      type: string
                      example: 张三
                      description: 收货人姓名
                    phone:
                      type: string
                      example: "13800138000"
                      description: 收货人电话
                    email:
                      type: string
                      format: email
                      example: zhangsan@example.com
                      description: 收货人邮箱
                    company:
                      type: string
                      example: 某某公司
                      description: 收货公司
                    address:
                      type: object
                      required:
                        - line1
                      description: 收货地址
                      properties:
                        line1:
                          type: string
                          example: 上海市浦东新区张江高科技园区
                          description: 地址行1
                        line2:
                          type: string
                          example: 999号
                          description: 地址行2
                        city:
                          type: string
                          example: 上海
                          description: 城市
                        province:
                          type: string
                          example: 上海
                          description: 省份
                        postalCode:
                          type: string
                          example: "201203"
                          description: 邮编
                        country:
                          type: string
                          default: CN
                          example: CN
                          description: 国家代码
                shipping:
                  type: object
                  description: 物流信息
                  properties:
                    method:
                      type: string
                      example: 顺丰速运
                      description: 配送方式
                    carrierCode:
                      type: string
                      example: SF
                      description: 承运商编码
                    trackingNumber:
                      type: string
                      example: SF1234567890
                      description: 运单号
                    shippingLabel:
                      type: object
                      description: 发货面单信息
                      properties:
                        url:
                          type: string
                          format: uri
                          example: https://example.com/labels/12345.pdf
                          description: 面单URL
                        base64:
                          type: string
                          example: data:image/png;base64,iVBORw0KGg...
                          description: 面单base64编码
                    expectedShipDate:
                      type: string
                      format: date-time
                      example: "2024-12-20T10:00:00Z"
                      description: 预计发货日期
                    expectedDeliveryDate:
                      type: string
                      format: date-time
                      description: 预计送达日期
                payment:
                  type: object
                  description: 支付信息
                  properties:
                    totalAmount:
                      type: number
                      example: 1089.00
                      description: 订单总金额
                    currency:
                      type: string
                      default: CNY
                      example: CNY
                      description: 币种
                    isPaid:
                      type: boolean
                      example: true
                      description: 是否已支付
                items:
                  type: array
                  description: 订单明细
                  minItems: 1
                  items:
                    type: object
                    required:
                      - skuCode
                      - quantity
                    properties:
                      lineNo:
                        type: integer
                        example: 1
                        description: 行号，不填则自动生成
                      skuCode:
                        type: string
                        example: SKU001
                        description: SKU编码
                      quantity:
                        type: integer
                        minimum: 1
                        example: 10
                        description: 数量
                      unit:
                        type: string
                        example: PCS
                        description: 单位编码
                      unitPrice:
                        type: number
                        example: 99.00
                        description: 单价
                      batchNo:
                        type: string
                        example: BATCH-2024-001
                        description: 批次号
                      expiryDate:
                        type: string
                        format: date-time
                        example: "2025-12-31T00:00:00Z"
                        description: 效期
                      udf:
                        type: string
                        example: 红色-L码
                        description: 自定义字段
                      remark:
                        type: string
                        example: 红色款
                        description: 备注
                remark:
                  type: string
                  example: 请尽快发货
                  description: 备注
                tags:
                  type: array
                  description: 标签列表
                  items:
                    type: string
                customFields:
                  type: object
                  description: 自定义字段
                  additionalProperties: true
            example:
              clientCode: CLIENT001
              warehouseCode: WH-SH-001
              externalOrderNo: SO-12345
              orderType: STANDARD
              source:
                platform: SHOPIFY
                platformOrderId: SHOP-ORDER-001
                channel: 官网
              consignee:
                name: 张三
                phone: "13800138000"
                address:
                  line1: 上海市浦东新区张江高科技园区
                  city: 上海
                  province: 上海
                  country: CN
                  postalCode: "201203"
              shipping:
                method: 顺丰速运
                trackingNumber: SF1234567890
                shippingLabel:
                  url: https://example.com/labels/12345.pdf
                expectedShipDate: "2024-12-20T10:00:00Z"
              payment:
                totalAmount: 1089.00
                currency: CNY
              remark: 请尽快发货
              items:
                - skuCode: SKU001
                  quantity: 10
                  unitPrice: 99.00
                  batchNo: BATCH-2024-001
                  expiryDate: "2025-12-31T00:00:00Z"
                  udf: 红色-L码
                  remark: 红色款
                - skuCode: SKU002
                  quantity: 5
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 订单创建成功
                  data:
                    type: object
        '400':
          description: 参数错误
        '401':
          description: 未授权
