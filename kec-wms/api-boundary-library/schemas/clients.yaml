module: clients
schema: createClientSchema

fields:
  clientCode:
    ref: short_code
    business_meaning: 客户编码

  clientName:
    ref: name_128
    business_meaning: 客户名称

  clientType:
    type: enum
    required: true
    enum_values:
      - STANDARD
      - VIP
      - ENTERPRISE
      - TRIAL

  contactEmail:
    type: string
    required: false
    format: email
    max_length: 128

  creditLimit:
    type: number
    required: false
    minimum: 0.01

  paymentTerms:
    type: integer
    required: true
    minimum: 0
    maximum: 365
