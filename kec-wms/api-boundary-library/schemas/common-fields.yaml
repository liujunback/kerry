version: 1

fields:
  uuid:
    type: string
    required: true
    allow_null: false
    allow_empty: false
    format: uuid
    valid_examples:
      - "11111111-1111-1111-1111-111111111111"
    invalid_examples:
      - ""
      - "123"
      - "not-a-uuid"
      - 123

  short_code:
    type: string
    required: true
    allow_null: false
    allow_empty: false
    min_length: 2
    max_length: 32
    charset: "A-Z0-9-"
    valid_examples:
      - "C001"
      - "WH-SH-001"
    invalid_examples:
      - "A"
      - "lowercase"
      - "中文"
      - "A B"

  name_128:
    type: string
    required: true
    allow_null: false
    allow_empty: false
    min_length: 2
    max_length: 128
    valid_examples:
      - "测试名称"
    invalid_examples:
      - ""
      - "A"

  positive_int:
    type: integer
    required: true
    minimum: 1
    valid_examples:
      - 1
      - 100
    invalid_examples:
      - 0
      - -1
      - "abc"
      - 1.5

  non_negative_int:
    type: integer
    required: true
    minimum: 0
    valid_examples:
      - 0
      - 30
    invalid_examples:
      - -1
      - "abc"

  bool_flag:
    type: boolean
    required: true
    valid_examples:
      - true
      - false
    invalid_examples:
      - "true"
      - "abc"
      - 1
      - null

  date_time_iso:
    type: string
    required: false
    format: datetime
    valid_examples:
      - "2026-05-20T10:00:00Z"
    invalid_examples:
      - "2026/05/20"
      - "not-a-date"
      - 123
