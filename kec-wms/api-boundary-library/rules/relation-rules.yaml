rules:
  - id: REL-SAME-LOCATION
    category: cross_field_dependency
    title: 原库位与目标库位相同
    scenario: fromLocationId == toLocationId
    expected: fail

  - id: REL-REQUIRED-WHEN
    category: cross_field_dependency
    title: 条件字段存在时依赖字段必填
    scenario: if A then B required
    expected: fail

  - id: REL-START-END
    category: cross_field_dependency
    title: 起始时间大于结束时间
    scenario: startDate > endDate
    expected: fail
