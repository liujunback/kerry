cases:
  - id: INV-ADJUST-REL-001
    title: fromLocationId 与 toLocationId 相同失败
    api: POST /api/v1/inventory/adjustments
    body:
      warehouseId: "11111111-1111-1111-1111-111111111111"
      adjustmentType: "LOCATION_ADJUST"
      reason: "边界测试"
      lines:
        - skuId: "22222222-2222-2222-2222-222222222222"
          fromLocationId: "33333333-3333-3333-3333-333333333333"
          toLocationId: "33333333-3333-3333-3333-333333333333"
          bucketType: "AVAILABLE"
          adjustQuantity: 1
    expected:
      http_status: 400
      success: false
      message_contains: 相同

  - id: INV-COUNT-TYPE-001
    title: clientIds 传字符串失败
    api: POST /api/v1/inventory/counts
    body:
      warehouseId: "11111111-1111-1111-1111-111111111111"
      scopeType: "FULL"
      clientIds: "not-an-array"
    expected:
      http_status: 400
      success: false
      message_contains: clientIds
